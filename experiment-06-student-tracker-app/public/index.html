<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERNLAB — Student Task & Evaluation Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-4 py-3 shadow-sm">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">
        <i class="fa-solid fa-graduation-cap text-warning me-2"></i> MERNLAB Capstone — Student Progress Tracker
      </span>
      <span class="badge bg-warning text-dark px-3 py-2 rounded-pill">Ameenul Lumin • MCA</span>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row g-4 mb-4">
      <div class="col-md-4">
        <div class="card p-3 shadow-sm border-0 rounded-4">
          <span class="text-muted small fw-bold">TOTAL ASSIGNMENTS</span>
          <h3 class="fw-bold mb-0 mt-1" id="totalCount">0</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 shadow-sm border-0 rounded-4">
          <span class="text-muted small fw-bold text-success">COMPLETED</span>
          <h3 class="fw-bold mb-0 mt-1 text-success" id="completedCount">0</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 shadow-sm border-0 rounded-4">
          <span class="text-muted small fw-bold text-warning">IN PROGRESS</span>
          <h3 class="fw-bold mb-0 mt-1 text-warning" id="pendingCount">0</h3>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card p-4 shadow-sm border-0 rounded-4">
          <h5 class="fw-bold mb-3"><i class="fa-solid fa-plus-circle text-primary me-2"></i> Add Assignment</h5>
          <form id="taskForm">
            <div class="mb-3">
              <label class="form-label small fw-bold">Assignment / Topic</label>
              <input type="text" id="taskTitle" class="form-control" placeholder="e.g. Socket Programming" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Subject / Course</label>
              <input type="text" id="taskSubject" class="form-control" placeholder="e.g. Computer Networks" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Submission Deadline</label>
              <input type="date" id="taskDueDate" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">Record Task</button>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card p-4 shadow-sm border-0 rounded-4">
          <h5 class="fw-bold mb-3">Academic Deliverables Feed</h5>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light small text-uppercase">
                <tr>
                  <th>Topic</th>
                  <th>Subject</th>
                  <th>Deadline</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="taskTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
